plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}
repositories { mavenCentral() }
sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}
dependencies {
    implementation 'org.openjfx:javafx-controls:23.0.2'
    implementation 'org.openjfx:javafx-fxml:23.0.2'
    implementation 'org.openjfx:javafx-base:23.0.2'
    implementation 'org.openjfx:javafx-graphics:23.0.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    implementation 'com.google.code.gson:gson:2.10.1'
}
javafx {
    version = "23.0.2"
    modules = ['javafx.controls', 'javafx.fxml']
}
application {
    mainClass = 'app.Launcher'
    applicationDefaultJvmArgs = [
        '-Xss4m',
        '--enable-native-access=javafx.graphics',
        '--add-opens', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '--add-opens', 'javafx.base/com.sun.javafx.reflect=ALL-UNNAMED',
        '--add-opens', 'javafx.base/com.sun.javafx.beans=ALL-UNNAMED',
        '--add-opens', 'javafx.fxml/javafx.fxml=ALL-UNNAMED',
        '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
    ]
}
compileJava {
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
tasks.named('processResources') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
run { classpath += sourceSets.main.resources }
tasks.named('compileTestJava') {
    options.encoding = 'UTF-8'
    modularity.inferModulePath = false
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    modularity.inferModulePath = false
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    testLogging { events 'passed', 'skipped', 'failed' }
}
